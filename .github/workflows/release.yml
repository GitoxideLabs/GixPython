name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested artifacts to PyPI (run from the version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and changelog
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 etc/test_check_release.py
          if [[ "$PUBLISH" == true ]]; then
            [[ "$RELEASE_REF" == refs/tags/v* ]] || exit 1
            python3 etc/check_release.py --tag "$RELEASE_TAG"
          else
            python3 etc/check_release.py
          fi

  artifacts:
    needs: metadata
    uses: ./.github/workflows/artifacts.yml # zizmor: ignore[self-repository] Keep the same-commit syntax supported by actionlint 1.7.12.

  validate:
    name: Validate complete release set
    needs: artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Validate distributions
        run: python3 etc/check_release.py --dist dist

  publish:
    name: Publish to PyPI
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/GixPython/
    permissions:
      id-token: write # Authenticate this approved release with PyPI Trusted Publishing.
    steps:
      - name: Download tested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2; commit SHA, required for its GHCR image tag.
