[package]
name = "pygix"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Faithful, parallel Python bindings to gix::Repository"
repository = "https://github.com/GitoxideLabs/pygix"
publish = false

[lib]
name = "_gix"
crate-type = ["cdylib", "rlib"]

[features]
default = ["max-pure"]
max-pure = ["sha1", "sha256", "max-performance", "revision", "revparse-regex", "index", "attributes", "dirwalk", "status", "blob-diff", "merge", "blame", "notes", "mailmap", "worktree-mutation", "worktree-stream", "worktree-archive", "https"]
sha1 = ["gix/sha1", "gix-archive?/sha1"]
sha256 = ["gix/sha256", "gix-archive?/sha256"]
max-performance = ["gix/max-performance"]
revision = ["gix/revision", "index"]
revparse-regex = ["gix/revparse-regex", "revision"]
index = ["gix/index"]
attributes = ["gix/attributes", "index"]
dirwalk = ["gix/dirwalk", "attributes"]
status = ["gix/status", "dirwalk", "blob-diff"]
blob-diff = ["gix/blob-diff", "attributes"]
merge = ["gix/merge", "blob-diff"]
blame = ["gix/blame", "blob-diff"]
notes = ["gix/notes"]
mailmap = ["gix/mailmap", "revision"]
worktree-mutation = ["gix/worktree-mutation", "status"]
worktree-stream = ["gix/worktree-stream", "attributes"]
worktree-archive = ["gix/worktree-archive", "worktree-stream", "archive-tar", "archive-tar-gz", "archive-zip"]
archive-tar = ["dep:gix-archive", "gix-archive/tar"]
archive-tar-gz = ["archive-tar", "gix-archive/tar_gz"]
archive-zip = ["dep:gix-archive", "gix-archive/zip"]
network = ["gix/blocking-network-client", "attributes"]
http = ["network", "gix/blocking-http-transport-reqwest", "dep:reqwest"]
https = ["http", "reqwest/rustls-no-provider", "dep:rustls", "dep:rustls-graviola", "dep:graviola", "dep:rustls-platform-verifier"]
tracing = ["gix/tracing"]
tracing-detail = ["tracing", "gix/tracing-detail"]
abi3 = ["pyo3/abi3-py311"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["multiple-pymethods"] }
gix = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "f819565c2c4c56619c4888acef6cf3b8144cbccb", default-features = false, features = ["parallel", "auto-chain-error", "progress-tree"] }
gix-archive = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "f819565c2c4c56619c4888acef6cf3b8144cbccb", default-features = false, optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12"], optional = true }
rustls-graviola = { version = "=0.4.0", optional = true }
graviola = { version = "=0.4.1", optional = true }
rustls-platform-verifier = { version = "0.7.0", optional = true }

[build-dependencies]
pyo3-build-config = "0.29.3"

[patch."https://github.com/GitoxideLabs/gitoxide"]
gix-transport = { path = "vendor/gix-transport" }
gix-ref = { path = "vendor/gix-ref" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
